<!doctype html>
<meta charset="utf-8">
<title>Zhouyi splash</title>
<style>html,body{margin:0;background:#888}canvas{height:96vh;display:block;margin:2vh auto}</style>
<canvas id="c" width="888" height="1920"></canvas>
<script>
// Deterministic ink-wash splash. renderFrame(t) is a pure function of t after init(variant).
// Preview: index.html?variant=dark&t=1.2  (or &play for a loop)
const W = 888, H = 1920, CX = 444, CY = 960, FPS = 30, DUR = 2.2;
const VARIANTS = {
  light: { bg: '#F3EDE1', ink: '#2B2621', red: '#B5452F', seal: '#B5452F', dropA: 1, inkA: .96, gAmp: 1, grain: ['#b8ab94', '#fffaf0'], sealText: '#FBF7EF' },
  dark:  { bg: '#1C1915', ink: '#E6DDCD', red: '#D9674E', seal: '#C9563F', dropA: 0.55, inkA: .86, gAmp: .45, grain: ['#0c0a08', '#4a4238'], sealText: '#FBF7EF' },
};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const k = clamp((x - a) / (b - a)); return k * k * (3 - 2 * k); };
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function noise1(seed) { // smooth 1D value noise in [0,1]
  const r = rng(seed), T = Array.from({ length: 512 }, r);
  return x => { const i = Math.floor(x), f = x - i, a = T[i & 511], b = T[(i + 1) & 511], s = f * f * (3 - 2 * f); return a + (b - a) * s; };
}
function ring(seed, n) { // periodic radial noise: sum of seeded sines, returns f(theta, amp) around 0
  const r = rng(seed), H = Array.from({ length: n }, (_, k) => ({ k: 2 + Math.floor(r() * 2) + k * 2, p: r() * 6.283, a: 1 / (k + 1.3) }));
  return th => H.reduce((s, h) => s + h.a * Math.sin(h.k * th + h.p), 0);
}

let V, grain, mask, fine, wash, inkL, content, seal, strokes, drop, sealFont;

function pickFont() {
  const probe = f => { const c = mk(140, 80), x = c.getContext('2d'); x.font = f; x.fillText('卦成', 4, 64); return c.toDataURL(); };
  const base = probe('60px sans-serif');
  for (const n of ['Songti SC', 'STSong', 'Noto Serif CJK SC'])
    if (probe(`900 60px "${n}", sans-serif`) !== base) return n;
  return null;
}

function makeGrain(seed) {
  const c = mk(), x = c.getContext('2d'), r = rng(seed);
  // low-frequency tonal clouds
  const lo = mk(40, 86), lx = lo.getContext('2d'), id = lx.createImageData(40, 86);
  for (let i = 0; i < id.data.length; i += 4) { const v = r(); const col = v > .5 ? 255 : 0; id.data[i] = id.data[i + 1] = id.data[i + 2] = col; id.data[i + 3] = Math.abs(v - .5) * 9 * V.gAmp; }
  lx.putImageData(id, 0, 0); x.imageSmoothingQuality = 'high'; x.drawImage(lo, 0, 0, W, H);
  // per-pixel tooth
  const px = x.getImageData(0, 0, W, H), d = px.data;
  for (let i = 0; i < d.length; i += 4) { const v = r() - .5; const a = Math.abs(v) * 12 * V.gAmp; const cc = v > 0 ? 255 : 0; const k = a / 255, ka = d[i + 3] / 255;
    const oa = k + ka * (1 - k); if (oa > 0) { for (let j = 0; j < 3; j++) d[i + j] = (cc * k + d[i + j] * ka * (1 - k)) / oa; d[i + 3] = oa * 255; } }
  x.putImageData(px, 0, 0);
  // fibres
  x.lineCap = 'round';
  for (let i = 0; i < 2600; i++) {
    let px0 = r() * W, py0 = r() * H, a = r() * 6.283, len = 12 + r() * 70, bend = (r() - .5) * .08;
    x.strokeStyle = V.grain[r() < .6 ? 0 : 1]; x.globalAlpha = (.02 + r() * .045) * (V.gAmp < 1 ? .7 : 1); x.lineWidth = .4 + r() * .9;
    x.beginPath(); x.moveTo(px0, py0);
    for (let s = 0; s < len; s += 4) { a += bend; px0 += Math.cos(a) * 4; py0 += Math.sin(a) * 4; x.lineTo(px0, py0); }
    x.stroke();
  }
  return c;
}

function makeMask(seed, cw, ch, amp) { // smooth alpha-noise texture for mottling
  const r = rng(seed), c = mk(), x = c.getContext('2d');
  const s = mk(cw, ch), sx = s.getContext('2d'), id = sx.createImageData(cw, ch);
  for (let i = 0; i < id.data.length; i += 4) { id.data[i] = id.data[i + 1] = id.data[i + 2] = 0; id.data[i + 3] = Math.pow(r(), 1.6) * amp; }
  sx.putImageData(id, 0, 0); x.imageSmoothingQuality = 'high'; x.drawImage(s, 0, 0, W, H);
  return c;
}

// ---------- brush ----------
function buildStroke(fn, o) { // fn(u) -> [x,y]; resample by arc length at 1px
  const N = 3000, P = [], L = [0];
  for (let i = 0; i <= N; i++) { P.push(fn(i / N)); if (i) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1])); }
  const len = L[N], xs = [], ys = [], nx = [], ny = [];
  for (let s = 0, j = 0; s <= len; s++) {
    while (L[j + 1] < s) j++;
    const k = (s - L[j]) / (L[j + 1] - L[j] || 1);
    xs.push(lerp(P[j][0], P[j + 1][0], k)); ys.push(lerp(P[j][1], P[j + 1][1], k));
    const dx = P[j + 1][0] - P[j][0], dy = P[j + 1][1] - P[j][1], dl = Math.hypot(dx, dy) || 1;
    const c = Math.cos(o.tilt || 0), sn = Math.sin(o.tilt || 0), ux = -dy / dl, uy = dx / dl;
    nx.push(ux * c - uy * sn); ny.push(ux * sn + uy * c);
  }
  const r = rng(o.seed), NB = o.bristles || 60, B = [];
  for (let i = 0; i < NB; i++) B.push({ o: -1 + 2 * (i + .5) / NB + (r() - .5) / NB, load: r(), f: .006 + r() * .02, n: noise1(o.seed * 97 + i), rad: .7 + r() * .7, wob: noise1(o.seed * 131 + i) });
  return { ...o, xs, ys, nx, ny, len: xs.length - 1, B, wn: noise1(o.seed + 7) };
}

function drawStroke(x, S, prog) {
  const n = Math.floor(clamp(prog) * S.len); if (n < 2) return;
  x.fillStyle = S.color;
  const NB = S.B.length, CH = 36;
  for (const b of S.B) {
    const edge = Math.abs(b.o);
    for (let c0 = 0; c0 < n; c0 += CH) {
      x.beginPath(); let any = false;
      const c1 = Math.min(n, c0 + CH + 1);
      for (let s = c0; s < c1; s++) {
        const u = s / S.len;
        const w = S.width(u) * S.W * (1 + .12 * (S.wn(s * .03) - .5));
        const dry = S.dry(u) * (.7 + .5 * edge) + (edge > .82 ? .3 : 0) + (edge > .93 ? .2 : 0);
        const v = b.n(s * b.f * (1 + 1.5 * S.dry(u)) + b.load * 50);
        if (v < dry) continue;
        const off = b.o * w / 2 + (b.wob(s * .02) - .5) * 2.2;
        const rad = Math.max(.6, w / NB * 1.5 * b.rad * (1 - .2 * S.dry(u)));
        const px = S.xs[s] + S.nx[s] * off, py = S.ys[s] + S.ny[s] * off;
        x.moveTo(px + rad, py); x.arc(px, py, rad, 0, 6.2832); any = true;
      }
      if (!any) continue;
      const u0 = c0 / S.len;
      x.globalAlpha = clamp((1 - .35 * u0 * S.fade) * (.72 + .28 * b.load));
      x.fill();
    }
  }
  x.globalAlpha = 1;
}

// width / dryness profiles
const hengW = u => u < .08 ? lerp(.4, 1.18, easeOut(u / .08)) : u < .3 ? lerp(1.18, .9, smooth(.08, .3, u)) : u < .82 ? lerp(.9, .86, (u - .3) / .52) : u < .9 ? lerp(.86, .98, smooth(.82, .9, u)) : lerp(.98, .5, smooth(.9, 1, u));
const hengDry = u => .05 + .65 * smooth(.55, 1, u);

function buildScene() {
  const R0 = 258, a0 = -150 * Math.PI / 180, sweep = 322 * Math.PI / 180;
  const wob = noise1(11);
  const enso = buildStroke(u => {
    const th = a0 + sweep * u, rr = R0 + 10 * u - 4 + (wob(u * 6) - .5) * 7;
    return [CX + Math.cos(th) * rr, CY + Math.sin(th) * rr];
  }, { seed: 3, W: 50, bristles: 72, color: V.ink, fade: 1, tilt: -.5,
       width: u => u < .035 ? lerp(.45, 1.05, easeOut(u / .035)) : u < .12 ? lerp(1.05, .95, (u - .035) / .085) : lerp(.95, .45, Math.pow((u - .12) / .88, 1.3)),
       dry: u => .02 + .8 * smooth(.3, 1, u) });
  enso.t0 = .60; enso.t1 = 1.02; enso.ease = easeInOut;
  const out = [enso];
  const half = 124, pitch = 36, W0 = 21;
  for (let k = 0; k < 6; k++) {
    const y = CY + 90 - k * pitch, ts = 1.0 + k * .083, color = k === 4 ? V.red : V.ink;
    const segs = k === 2 ? [[-half, -18, ts, ts + .036], [18, half, ts + .04, ts + .076]] : [[-half, half, ts, ts + .076]];
    segs.forEach(([x0, x1, t0, t1], j) => {
      const wn = noise1(50 + k * 7 + j), span = x1 - x0;
      const S = buildStroke(u => {
        // diagonal drop-in for the first 5%, then a slightly rising, slightly sagging horizontal
        const ent = clamp(u / .05), xx = CX + x0 + span * u, lift = -span * .025 * u + Math.sin(u * Math.PI) * 2.5 + (wn(u * 4) - .5) * 2.5;
        return [xx - (1 - ent) * 3, y + lift - (1 - easeOut(ent)) * 5];
      }, { seed: 20 + k * 3 + j, W: W0 * (k === 2 ? .98 : 1), bristles: 40, color, fade: .6, tilt: -.6,
           width: hengW, dry: hengDry });
      S.t0 = t0; S.t1 = t1; S.ease = easeOut; out.push(S);
    });
  }
  return out;
}

function makeSeal() {
  const S = 92, c = mk(140, 140), x = c.getContext('2d'), r = rng(77), o = (140 - S) / 2;
  x.translate(o, o);
  // rough square outline
  x.beginPath();
  const pts = [];
  const edge = (ax, ay, bx, by) => { for (let k = 0; k < 1; k += .04) pts.push([lerp(ax, bx, k) + (r() - .5) * 2.2, lerp(ay, by, k) + (r() - .5) * 2.2]); };
  edge(0, 0, S, 0); edge(S, 0, S, S); edge(S, S, 0, S); edge(0, S, 0, 0);
  pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath();
  x.fillStyle = V.seal; x.fill();
  // white inner border
  x.strokeStyle = V.sealText; x.lineWidth = 2.4; x.globalAlpha = .95;
  x.beginPath(); x.moveTo(7, 7.5); x.lineTo(S - 7.5, 7); x.lineTo(S - 7, S - 7.5); x.lineTo(7.5, S - 7); x.closePath(); x.stroke();
  x.globalAlpha = 1;
  if (sealFont) { // 白文: 卦 on the right column, 成 on the left, read right-to-left
    x.fillStyle = V.sealText; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `900 40px "${sealFont}"`;
    for (const [ch, cx] of [['卦', S * .735], ['成', S * .27]]) { x.save(); x.translate(cx, S / 2 + 1); x.scale(.98, 1.75); x.fillText(ch, 0, 0); x.restore(); }
  }
  // worn paste: speckle knock-outs and a couple of chipped corners
  x.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 200; i++) { x.globalAlpha = .2 + r() * .5; x.beginPath(); x.arc(r() * S, r() * S, .3 + Math.pow(r(), 4) * 1.4, 0, 6.283); x.fill(); }
  for (const [a, b] of [[0, S], [S, 0]]) { x.globalAlpha = .9; x.beginPath(); x.arc(a + (r() - .5) * 3, b + (r() - .5) * 3, 3 + r() * 3, 0, 6.283); x.fill(); }
  x.globalAlpha = .18; x.drawImage(fine, 0, 0, 140, 140, -o, -o, 140, 140);
  return c;
}

function blobPath(x, cx, cy, R, f, irr) {
  x.beginPath();
  for (let i = 0; i <= 200; i++) { const th = i / 200 * 6.2832, rr = R * (1 + irr * f(th)); i ? x.lineTo(cx + Math.cos(th) * rr, cy + Math.sin(th) * rr) : x.moveTo(cx + Math.cos(th) * rr, cy + Math.sin(th) * rr); }
  x.closePath();
}

function drawDrop(x, t) {
  if (t < .25) return;
  x.fillStyle = V.ink;
  const tImp = .37;
  if (t < tImp) { // falling droplet with a short motion trail
    const k = (t - .25) / (tImp - .25), y = lerp(CY - 280, CY, k * k);
    for (let g = 3; g >= 0; g--) {
      x.globalAlpha = (g ? .12 / g : .9) * clamp(k * 4);
      x.beginPath(); x.ellipse(CX, y - g * 16 * k, 7 - g, 11 + g * 3, 0, 0, 6.283); x.fill();
    }
    x.globalAlpha = 1; return;
  }
  const p = clamp((t - tImp) / (.80 - tImp)), e = easeOut(p);
  const R = lerp(10, 150, e), dens = lerp(.95, .22, Math.pow(e, .8)), irr = lerp(.02, .075, e);
  const fs = [ring(5, 5), ring(6, 6), ring(7, 7), ring(8, 5), ring(9, 8)];
  for (let k = 0; k < 5; k++) {
    const Rk = R * (.42 + .145 * k);
    x.filter = `blur(${(1.5 + Rk * .07 * (k + 1) / 3).toFixed(2)}px)`;
    x.globalAlpha = dens * (k === 4 ? .38 : .26);
    blobPath(x, CX + (k - 2) * e * 1.8, CY + (k % 2 ? 1 : -1) * e * 2.2, Rk, fs[k], irr * (1 + k * .15)); x.fill();
  }
  // tide-line: ink pigment gathering at the wet edge
  x.filter = 'blur(2.4px)'; x.globalAlpha = dens * .3; x.strokeStyle = V.ink; x.lineWidth = 1.6 + 2 * e;
  blobPath(x, CX + 3.6 * e, CY + 2.2 * e, R * 1.0, fs[4], irr * 1.6); x.stroke();
  // fibre-borne feathering past the edge
  x.filter = 'blur(.6px)'; x.lineWidth = .8; const r = rng(42);
  x.globalAlpha = dens * .35; x.beginPath();
  for (let i = 0; i < 260; i++) { const th = r() * 6.283, rr = R * (1 + irr * 1.6 * fs[4](th)) * (.97 + r() * .04), l = R * (.03 + r() * .09) * e;
    const a = th + (r() - .5) * .9; x.moveTo(CX + Math.cos(th) * rr, CY + Math.sin(th) * rr); x.lineTo(CX + Math.cos(th) * rr + Math.cos(a) * l, CY + Math.sin(th) * rr + Math.sin(a) * l); }
  x.stroke();
  x.filter = 'none'; x.globalAlpha = 1;
}

function init(variant) {
  V = VARIANTS[variant]; document.body.style.background = V.bg;
  sealFont = pickFont();
  grain = makeGrain(1); mask = makeMask(2, 60, 130, 255); fine = makeMask(4, 300, 650, 255);
  wash = mk(); inkL = mk(); content = mk();
  strokes = buildScene(); seal = makeSeal();
  return { sealFont };
}

function renderFrame(t) {
  const fade = 1 - smooth(1.75, 2.03, t);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = V.bg; ctx.fillRect(0, 0, W, H);
  if (fade <= 0) return; // exact flat background for the crossfade tail
  ctx.globalAlpha = fade; ctx.drawImage(grain, 0, 0);

  const cx = content.getContext('2d'); cx.clearRect(0, 0, W, H);
  // ink drop wash
  const wx = wash.getContext('2d'); wx.clearRect(0, 0, W, H); drawDrop(wx, t);
  wx.globalCompositeOperation = 'destination-out'; wx.globalAlpha = .55; wx.drawImage(mask, 0, 0); wx.globalAlpha = .35; wx.drawImage(fine, 0, 0);
  wx.globalCompositeOperation = 'source-over'; wx.globalAlpha = 1;
  cx.globalAlpha = V.dropA; cx.drawImage(wash, 0, 0);
  // brush strokes
  const ix = inkL.getContext('2d'); ix.clearRect(0, 0, W, H);
  for (const S of strokes) if (t > S.t0) drawStroke(ix, S, S.ease(clamp((t - S.t0) / (S.t1 - S.t0))));
  ix.globalCompositeOperation = 'destination-out'; ix.globalAlpha = .16; ix.drawImage(mask, 0, 0); ix.globalAlpha = .2; ix.drawImage(fine, 0, 0);
  ix.globalCompositeOperation = 'source-over'; ix.globalAlpha = 1;
  cx.filter = 'blur(3px)'; cx.globalAlpha = .28 * V.inkA; cx.drawImage(inkL, 0, 0);
  cx.filter = 'blur(1px)'; cx.globalAlpha = .35; cx.drawImage(inkL, 0, 0);
  cx.filter = 'none'; cx.globalAlpha = V.inkA; cx.drawImage(inkL, 0, 0);
  // seal stamp
  if (t >= 1.45) {
    const p = clamp((t - 1.45) / .12), sc = p < 1 ? lerp(1.3, 1, p * p) : 1 - .015 * Math.sin(clamp((t - 1.57) / .06) * Math.PI);
    cx.save(); cx.translate(CX + 240, CY + 246); cx.rotate(2.6 * Math.PI / 180); cx.scale(sc, sc);
    cx.globalAlpha = p < 1 ? .15 + .45 * p : 1; cx.drawImage(seal, -70, -70); cx.restore();
  }
  cx.globalAlpha = 1;
  ctx.globalAlpha = fade; ctx.drawImage(content, 0, 0); ctx.globalAlpha = 1;
}

const q = new URLSearchParams(location.search);
if (q.has('variant') || q.has('t') || q.has('play')) {
  init(q.get('variant') || 'light');
  if (q.has('play')) { const t0 = performance.now(); const loop = () => { renderFrame(((performance.now() - t0) / 1000) % (DUR + .6)); requestAnimationFrame(loop); }; loop(); }
  else renderFrame(+q.get('t') || 1.7);
}
</script>
