name: Zhouyi
options:
  bundleIdPrefix: com.lswang
  developmentLanguage: en   # 首选语言都不支持时，系统界面与应用内同退回英文
  deploymentTarget:
    iOS: "17.0"
packages:
  Tyme4Swift:   # 历法：四柱干支（立春换年、节令换月），MIT
    url: https://github.com/6tail/tyme4swift
    from: 1.5.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: TX57ZT87FD
    CODE_SIGN_STYLE: Automatic
targets:
  Zhouyi:
    type: application
    platform: iOS
    sources: [Zhouyi]
    dependencies:
      - package: Tyme4Swift
    info:
      path: Zhouyi/Info.plist   # 与 GENERATE_INFOPLIST_FILE 合并
      properties:
        CFBundleLocalizations: [zh-Hans, zh-Hant, en, ja, ko, es, fr, de, pt-BR, ru, ar]
        UILaunchScreen:
          UIColorName: LaunchBackground   # 启动屏宣纸底色，与首帧 layer1 一致
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lswang.zhouyi
        INFOPLIST_KEY_CFBundleDisplayName: 周易卜卦
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # 临时图标，正式上架前替换
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  ZhouyiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ZhouyiTests]
    dependencies:
      - target: Zhouyi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Zhouyi.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Zhouyi
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Zhouyi:
    build:
      targets:
        Zhouyi: all
        ZhouyiTests: [test]
    test:
      targets: [ZhouyiTests]
